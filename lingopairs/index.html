<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lingo Pairs</title>

<!--
  syntheticm2m.com/lingopairs - the link every shared result card carries.

  WHY THIS PAGE EXISTS AT ALL: a share card is only worth the link at the
  bottom of it, and that link gets pasted into group chats by players. The
  worker's own address (vocab-match.disco-seat.workers.dev) reads like spam
  there. This path is on a domain the owner already has, so nothing new was
  bought and there is no renewal to forget.

  It holds NO routing logic of its own on purpose. GitHub Pages cannot read a
  User-Agent, and duplicating the iPhone/Android/desktop decision here would
  mean two places to change every time a store listing goes live. So this
  forwards to /get on the worker, which owns that decision alone.

  Three ways out, in order, so a reader always lands somewhere:
    1. the JS replace below, instant, and leaves no history entry to trap the
       back button,
    2. the meta refresh, for a browser with JS turned off,
    3. the visible links, if even that is blocked.

  The og: tags are the reason this is a real page rather than a redirect rule:
  a chat app previewing the link shows the name, the sentence and the icon
  instead of a bare URL, which is most of what makes a shared card look worth
  tapping.
-->

<link rel="canonical" href="https://syntheticm2m.com/lingopairs/">
<meta name="description" content="Match words in two languages. One daily board, the same one for everyone. No ads, no subscription.">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Lingo Pairs">
<meta property="og:title" content="Lingo Pairs">
<meta property="og:description" content="Match words in two languages. One daily board, the same one for everyone. No ads, no subscription.">
<meta property="og:url" content="https://syntheticm2m.com/lingopairs/">
<meta property="og:image" content="https://syntheticm2m.com/lingopairs/icon.png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Lingo Pairs">
<meta name="twitter:description" content="Match words in two languages. One daily board, the same one for everyone.">
<meta name="twitter:image" content="https://syntheticm2m.com/lingopairs/icon.png">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/lingopairs/icon.png">

<meta http-equiv="refresh" content="0; url=https://lingopairs.syntheticm2m.com/get">

<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0e4f52;
    color: #f3ecd8;
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 22px; margin: 18px 0 6px; }
  p { margin: 0 0 20px; opacity: 0.8; }
  a { color: #241b00; background: #ffd54a; text-decoration: none;
      padding: 12px 22px; border-radius: 999px; font-weight: 700;
      display: inline-block; margin: 4px; }
  a.plain { background: none; color: #f3ecd8; text-decoration: underline; font-weight: 400; }
</style>
</head>
<body>
  <main>
    <img src="/lingopairs/icon.png" alt="">
    <h1>Lingo Pairs</h1>
    <p>Opening the game&hellip;</p>
    <a href="https://lingopairs.syntheticm2m.com/get">Continue</a>
    <br>
    <a class="plain" href="https://lingopairs.syntheticm2m.com/">Play in the browser</a>
  </main>
<script>
  // replace(), not assign(): the back button should return to wherever the
  // reader came from, not bounce them through this page again.
  location.replace("https://lingopairs.syntheticm2m.com/get");
</script>
</body>
</html>
