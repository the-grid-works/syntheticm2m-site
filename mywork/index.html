<style>
:root{--bg:#07090d;--panel:#0d1117;--border:#1c2333;--text:#e6edf3;--muted:#7d8590;--accent:#39d0d8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:40px 32px;max-width:360px;width:100%;text-align:center;box-shadow:0 0 60px rgba(57,208,216,.06);}
h1{font-size:1.15rem;font-weight:600;margin-bottom:6px;}
p{color:var(--muted);font-size:.85rem;margin-bottom:22px;}
input{width:100%;background:#0a0e14;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:11px 12px;font-size:1rem;outline:none;text-align:center;}
input:focus{border-color:var(--accent);}
button{width:100%;margin-top:12px;background:var(--accent);color:#04262a;border:0;border-radius:8px;padding:11px;font-size:.95rem;font-weight:600;cursor:pointer;}
button:disabled{opacity:.5;cursor:wait;}
.err{color:#f47067;font-size:.8rem;margin-top:10px;min-height:1em;}
</style>
</head>

const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function derive(pw){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b(P.salt), iterations:P.iter, hash:"SHA-256"}, km,
    {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function unlockWithKey(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(P.iv)}, key, b(P.ct));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("btn"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = "";
  try {
    const key = await derive(document.getElementById("pw").value);
    const raw = await crypto.subtle.exportKey("raw", key);
    await unlockWithKey(key);
    localStorage.setItem("mywork_k", btoa(String.fromCharCode(...new Uint8Array(raw))));
  } catch(_) {
    err.textContent = "Wrong password.";
    btn.disabled = false;
  }
});
(async () => {
  const saved = localStorage.getItem("mywork_k");
  if (!saved) return;
  try {
    const key = await crypto.subtle.importKey("raw", b(saved), {name:"AES-GCM"}, false, ["decrypt"]);
    await unlockWithKey(key);
  } catch(_) { localStorage.removeItem("mywork_k"); }
})();
